<!doctype html>
<html lang="ko" class="theme-light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#FBF7F1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!--
			Naver Search Advisor site ownership.

			The file method does not work on this host: Cloudflare's asset handler
			strips .html and 307-redirects, so /naver<token>.html lands on
			/naver<token> instead of returning 200 at the URL Naver asks for. That
			redirect is what makes /guide work, so it stays — and ownership is
			proven with this tag instead. The token is the file name with the
			"naver" prefix and ".html" suffix removed; Naver's console shows the
			same value for the meta method.

			Deliberately outside the seo-fallback markers below: hooks.server.ts
			strips that block on the content pages, and this must appear on every
			page.
		-->
		<meta name="naver-site-verification" content="fdd82d78f46873e8f9244d7a563e1f42" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/fonts/PretendardVariable.woff2"
		/>
		<!--
			seo-fallback: static defaults, deliberately duplicated from
			src/lib/seo/site.ts.

			The app renders client-side, so anything a component puts in the head
			only exists after JavaScript runs. Google renders; Naver and the
			KakaoTalk link crawler do not — and KakaoTalk is how a Korean church
			app actually spreads. Without these tags a shared link previews as a
			bare URL.

			The server-rendered content pages write their own, so hooks.server.ts
			strips this block for them — two title tags on one page is a coin
			flip nobody needs to call. Do not write the head placeholder token
			inside this comment: SvelteKit substitutes its first occurrence in
			the file, and putting it here buries the real head inside a comment.
		-->
		<!--seo-fallback-->
		<title>MemScripture — 성경 암송 앱</title>
		<meta
			name="description"
			content="성경 구절을 외우고 스스로 점검하는 무료 웹 앱. 구절을 가린 채 한 단어씩 여는 연습과, 직접 입력해 정확도·속도를 재는 점검을 함께 제공합니다. 설치 없이 브라우저에서 바로 쓰고, 구글 드라이브로 기기 간 동기화됩니다."
		/>
		<link rel="canonical" href="https://mem.lifescripture.org/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="MemScripture" />
		<meta property="og:locale" content="ko_KR" />
		<meta property="og:title" content="MemScripture — 성경 암송 앱" />
		<meta
			property="og:description"
			content="성경 구절을 외우고 스스로 점검하는 무료 웹 앱. 연습과 점검, 난이도 기록과 기기 간 동기화까지."
		/>
		<meta property="og:url" content="https://mem.lifescripture.org/" />
		<meta property="og:image" content="https://mem.lifescripture.org/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<!--/seo-fallback-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
